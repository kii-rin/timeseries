name: russell-timeseries-manual

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: Run Russell weather prediction
        run: python scripts/run_weather_russell.py
      - name: Run Russell air quality prediction
        run: python scripts/run_air_quality_russell.py
      - name: Commit updated CSV logs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/weather_russell.csv reports/weather_russell_backtest.csv reports/air_quality_russell.csv
          git diff --cached --quiet || git commit -m "Update Russell time-series logs"
          git push
