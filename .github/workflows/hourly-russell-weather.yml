name: hourly-russell-weather

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  weather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: Run Russell weather guess
        run: python scripts/run_weather_russell.py
      - name: Commit updated weather reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/weather_russell.csv reports/weather_russell.md reports/weather_russell_backtest.csv
          git diff --cached --quiet || git commit -m "Update hourly Russell weather reports"
          git push
