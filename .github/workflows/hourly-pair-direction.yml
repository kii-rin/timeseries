name: hourly-pair-direction

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"

permissions:
  contents: write

jobs:
  direction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: Run direction guess
        run: python scripts/run_pair_direction.py --pair EURUSD=X
      - name: Run direction backtest
        run: python scripts/run_pair_backtest.py --pair EURUSD=X
      - name: Commit updated pair reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/pair_direction.csv reports/pair_direction.md reports/pair_direction_backtest.csv reports/pair_direction_backtest.md
          git diff --cached --quiet || git commit -m "Update hourly pair direction reports"
          git push
